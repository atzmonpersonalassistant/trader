          rc = int(sys.argv[1])
          path = pathlib.Path(sys.argv[2])
          payload = {}
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              payload = {}
          summary = payload.get("summary") if isinstance(payload.get("summary"), dict) else {}
          multiyear = payload.get("multiyear") if isinstance(payload.get("multiyear"), dict) else {}
          status = str(payload.get("status") or summary.get("status") or multiyear.get("status") or "")
          reason = str(payload.get("blocked_reason") or summary.get("blocked_reason") or multiyear.get("blocked_reason") or status or f"rc={rc}")
          text = f"{status} {reason}".upper()
          terminal = {"NO_FORWARD_CANDIDATES", "NO_FINAL_CANDIDATES_AFTER_HISTORICAL_OPTION_PNL"}
          retryable_statuses = {"BLOCKED_QC_CLOUD_RATE_LIMITED", "BLOCKED_QC_CLOUD_NO_SPARE_NODES", "BLOCKED_QC_CLOUD_CAPACITY"}
          retryable_markers = (
              "NASDAQ CALENDAR EMPTY",
              "NASDAQ CALENDAR PARTIAL FETCH/PARSE FAILURE",
              "TRADER_VALUATION_ANCHOR_NO_SESSION_DATA",
              "ZERO OPTION-CHAIN ROWS ON VALUATION DATE",
          )
          code_failure_markers = ("EXCEPTION", "BAD_JSON", "INVALID_", "NOT_IMPLEMENTED")
          if rc == 0:
              print(f"success\t{status or 'OK'}")
          elif status in terminal:
              print(f"terminal\t{status}")
          elif status in retryable_statuses or any(marker in text for marker in retryable_markers):
              print(f"retryable\t{reason}")
          elif any(marker in text for marker in code_failure_markers):
              print(f"failed\t{reason}")
          else:
              print(f"failed\t{reason}")
          PY
