name: Deploy agent tools to VPS

on:
  push:
    branches: [main]
    paths:
      - "agent-platform/tools/trading-*"
      - "agent-platform/tools/trading_*.py"
      - ".github/workflows/vps-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Install orchestrator/coding/review tools on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate required secrets are present
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          QUANTCONNECT_USER_ID: ${{ secrets.QUANTCONNECT_USER_ID }}
          QUANTCONNECT_API_TOKEN: ${{ secrets.QUANTCONNECT_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_HOST_KEY"
          test -n "$QUANTCONNECT_USER_ID"
          test -n "$QUANTCONNECT_API_TOKEN"

      - name: Compile tools before deploy
        run: |
          set -euo pipefail
          python3 -m py_compile \
            agent-platform/tools/trading_orchestrator.py \
            agent-platform/tools/trading_coding_agent.py \
            agent-platform/tools/trading_review_agent.py \
            agent-platform/tools/trading_coding_agent_stub.py \
            agent-platform/tools/trading_research_agent.py \
            agent-platform/tools/trading_agent_token.py

      - name: Install SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Pin VPS host key
        env:
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deploy bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_DIR: /tmp/trader-agent-tools-${{ github.sha }}
          QUANTCONNECT_USER_ID: ${{ secrets.QUANTCONNECT_USER_ID }}
          QUANTCONNECT_API_TOKEN: ${{ secrets.QUANTCONNECT_API_TOKEN }}
        run: |
          set -euo pipefail
          tmp_qc_env="$(mktemp)"
          trap 'rm -f "$tmp_qc_env"' EXIT
          chmod 600 "$tmp_qc_env"
          {
            printf "QUANTCONNECT_USER_ID=%q\n" "$QUANTCONNECT_USER_ID"
            printf "QUANTCONNECT_API_TOKEN=%q\n" "$QUANTCONNECT_API_TOKEN"
          } > "$tmp_qc_env"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "rm -rf '$DEPLOY_DIR' && mkdir -p '$DEPLOY_DIR'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            agent-platform/tools/trading-orchestrator \
            agent-platform/tools/trading-coding-agent \
            agent-platform/tools/trading-dispatch-coding-agent \
            agent-platform/tools/trading-dispatch-coding-agent-stub \
            agent-platform/tools/trading-review-agent \
            agent-platform/tools/trading-research-agent \
            agent-platform/tools/trading_agent_token.py \
            agent-platform/tools/trading_orchestrator.py \
            agent-platform/tools/trading_coding_agent.py \
            agent-platform/tools/trading_review_agent.py \
            agent-platform/tools/trading_coding_agent_stub.py \
            agent-platform/tools/trading_research_agent.py \
            "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/"
          scp -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$tmp_qc_env" "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/quantconnect.env"

      - name: Install tools and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_DIR: /tmp/trader-agent-tools-${{ github.sha }}
          QUANTCONNECT_USER_ID: ${{ secrets.QUANTCONNECT_USER_ID }}
          QUANTCONNECT_API_TOKEN: ${{ secrets.QUANTCONNECT_API_TOKEN }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_orchestrator.py" /usr/local/lib/trading_orchestrator.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_coding_agent.py" /usr/local/lib/trading_coding_agent.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_review_agent.py" /usr/local/lib/trading_review_agent.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_coding_agent_stub.py" /usr/local/lib/trading_coding_agent_stub.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_research_agent.py" /usr/local/lib/trading_research_agent.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-dispatch-coding-agent" /usr/local/sbin/trading-dispatch-coding-agent
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-dispatch-coding-agent-stub" /usr/local/sbin/trading-dispatch-coding-agent-stub
          if ! id agent-research >/dev/null 2>&1; then
            sudo useradd --system --create-home --shell /usr/sbin/nologin agent-research
          fi
          sudo install -d -o agent-research -g agent-research -m 750 /agents/research /agents/research/state /agents/research/logs /agents/research/reports /agents/research/lean-workspace
          sudo chown -R agent-research:agent-research /agents/research
          sudo chmod 750 /agents/research /agents/research/state /agents/research/logs /agents/research/reports /agents/research/lean-workspace
          if ! getent group agent-quantconnect >/dev/null 2>&1; then
            sudo groupadd --system agent-quantconnect
          fi
          sudo usermod -aG agent-quantconnect agent-orchestrator
          sudo usermod -aG agent-quantconnect agent-validator
          sudo usermod -aG agent-quantconnect agent-research
          sudo install -d -o root -g agent-quantconnect -m 750 /etc/trading-agents/secrets/quantconnect
          sudo install -o root -g agent-quantconnect -m 640 "$DEPLOY_DIR/quantconnect.env" /etc/trading-agents/secrets/quantconnect/env
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_agent_token.py" /usr/local/bin/trading-agent-token
          sudo tee /usr/local/bin/trading-orchestrator >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_orchestrator.py "$@"
          EOF_BIN
          sudo tee /usr/local/bin/trading-coding-agent >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_coding_agent.py "$@"
          EOF_BIN
          sudo tee /usr/local/bin/trading-review-agent >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_review_agent.py "$@"
          EOF_BIN
          sudo tee /usr/local/bin/trading-coding-agent-stub >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_coding_agent_stub.py "$@"
          EOF_BIN
          sudo tee /usr/local/bin/trading-research-agent >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_research_agent.py "$@"
          EOF_BIN
          sudo chmod 755 /usr/local/bin/trading-orchestrator /usr/local/bin/trading-coding-agent /usr/local/bin/trading-review-agent /usr/local/bin/trading-coding-agent-stub /usr/local/bin/trading-research-agent /usr/local/sbin/trading-dispatch-coding-agent /usr/local/sbin/trading-dispatch-coding-agent-stub
          python3 - <<'PY'
          from pathlib import Path
          for file in [
              Path('/usr/local/lib/trading_orchestrator.py'),
              Path('/usr/local/lib/trading_coding_agent.py'),
              Path('/usr/local/lib/trading_review_agent.py'),
              Path('/usr/local/lib/trading_coding_agent_stub.py'),
              Path('/usr/local/lib/trading_research_agent.py'),
              Path('/usr/local/bin/trading-agent-token'),
          ]:
              compile(file.read_text(), str(file), 'exec')
          PY
          test -s /etc/trading-agents/github-apps.json
          sudo -n -u agent-orchestrator env PYTHONDONTWRITEBYTECODE=1 trading-agent-token orchestrator | python3 -c 'import sys; token=sys.stdin.read().strip(); assert len(token) > 20'
          sudo -n -u agent-coding env PYTHONDONTWRITEBYTECODE=1 trading-agent-token coding | python3 -c 'import sys; token=sys.stdin.read().strip(); assert len(token) > 20'
          sudo -n -u agent-review env PYTHONDONTWRITEBYTECODE=1 trading-agent-token review | python3 -c 'import sys; token=sys.stdin.read().strip(); assert len(token) > 20'
          sudo -n -u agent-orchestrator bash -lc 'set -a; . /etc/trading-agents/secrets/quantconnect/env; test -n "$QUANTCONNECT_USER_ID"; test -n "$QUANTCONNECT_API_TOKEN"'
          sudo -n -u agent-research bash -lc 'set -a; . /etc/trading-agents/secrets/quantconnect/env; test -n "$QUANTCONNECT_USER_ID"; test -n "$QUANTCONNECT_API_TOKEN"'
          if ! sudo -n -u agent-research bash -lc 'command -v lean >/dev/null 2>&1'; then
            if ! python3 -m pip --version >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pip python3-venv
            fi
            sudo python3 -m pip install --break-system-packages --upgrade lean
          fi
          sudo -n -u agent-research bash -lc 'command -v lean >/dev/null 2>&1'
          sudo -n -u agent-research bash -lc 'set -euo pipefail; set -a; . /etc/trading-agents/secrets/quantconnect/env; set +a; export HOME=/home/agent-research; mkdir -p /agents/research/lean-workspace; printf "%s\n" "$QUANTCONNECT_API_TOKEN" | lean login --user-id "$QUANTCONNECT_USER_ID" >/tmp/trader-lean-login.log; lean whoami >/tmp/trader-lean-whoami.log'
          sudo tee /etc/sudoers.d/trading-agent-orchestrator-dispatch >/dev/null <<'EOF_SUDOERS'
          agent-orchestrator ALL=(root) NOPASSWD: /usr/local/sbin/trading-dispatch-coding-agent *
          agent-orchestrator ALL=(root) NOPASSWD: /usr/local/sbin/trading-dispatch-coding-agent-stub *
          EOF_SUDOERS
          sudo chmod 440 /etc/sudoers.d/trading-agent-orchestrator-dispatch
          sudo visudo -cf /etc/sudoers.d/trading-agent-orchestrator-dispatch >/dev/null
          sudo -n -u agent-orchestrator env PYTHONDONTWRITEBYTECODE=1 trading-orchestrator status >/tmp/trader-orchestrator-status.json
          sudo -n -u agent-orchestrator env PYTHONDONTWRITEBYTECODE=1 trading-orchestrator cleanup-workspaces --older-than-hours 24 >/tmp/trader-cleanup-dry-run.json
          sudo -n -u agent-research rm -f /agents/research/state/deploy-smoke-queue.json
          sudo -n -u agent-research env PYTHONDONTWRITEBYTECODE=1 trading-research-agent --queue /agents/research/state/deploy-smoke-queue.json seed-cheap-calls >/tmp/trader-research-seed.json
          sudo -n -u agent-research env PYTHONDONTWRITEBYTECODE=1 trading-research-agent --queue /agents/research/state/deploy-smoke-queue.json next >/tmp/trader-research-next.json
          sudo -n -u agent-research rm -f /agents/research/state/deploy-smoke-queue.json
          rm -rf "$DEPLOY_DIR"
          echo DEPLOY_OK
          REMOTE
