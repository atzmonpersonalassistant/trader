name: Deploy agent tools to VPS

on:
  push:
    branches: [main]
    paths:
      - "agent-platform/tools/trading-*"
      - "agent-platform/tools/trading_*.py"
      - "agent-platform/scripts/trading-research-agent-loop"
      - "agent-platform/scripts/trading-research-qc-smoke"
      - "agent-platform/scripts/trading-research-qc-broker"
      - "agent-platform/scripts/trading-orchestrator-tick"
      - ".github/workflows/vps-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Install orchestrator/coding/review tools on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate required secrets are present
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          QUANTCONNECT_USER_ID: ${{ secrets.QUANTCONNECT_USER_ID }}
          QUANTCONNECT_API_TOKEN: ${{ secrets.QUANTCONNECT_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_HOST_KEY"
          test -n "$QUANTCONNECT_USER_ID"
          test -n "$QUANTCONNECT_API_TOKEN"

      - name: Compile tools before deploy
        run: |
          set -euo pipefail
          python3 -m py_compile \
            agent-platform/tools/trading_orchestrator.py \
            agent-platform/tools/trading_coding_agent.py \
            agent-platform/tools/trading_review_agent.py \
            agent-platform/tools/trading_coding_agent_stub.py \
            agent-platform/tools/trading_research_agent.py \
            agent-platform/tools/trading_agent_token.py

      - name: Install SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Pin VPS host key
        env:
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deploy bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_DIR: /tmp/trader-agent-tools-${{ github.sha }}
          QUANTCONNECT_USER_ID: ${{ secrets.QUANTCONNECT_USER_ID }}
          QUANTCONNECT_API_TOKEN: ${{ secrets.QUANTCONNECT_API_TOKEN }}
        run: |
          set -euo pipefail
          tmp_qc_env="$(mktemp)"
          trap 'rm -f "$tmp_qc_env"' EXIT
          chmod 600 "$tmp_qc_env"
          {
            printf "QUANTCONNECT_USER_ID=%q\n" "$QUANTCONNECT_USER_ID"
            printf "QUANTCONNECT_API_TOKEN=%q\n" "$QUANTCONNECT_API_TOKEN"
          } > "$tmp_qc_env"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "rm -rf '$DEPLOY_DIR' && mkdir -p '$DEPLOY_DIR'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            agent-platform/tools/trading-orchestrator \
            agent-platform/tools/trading-coding-agent \
            agent-platform/tools/trading-dispatch-coding-agent \
            agent-platform/tools/trading-dispatch-review-agent \
            agent-platform/tools/trading-dispatch-coding-agent-stub \
            agent-platform/tools/trading-review-agent \
            agent-platform/tools/trading-research-agent \
            agent-platform/scripts/trading-research-agent-loop \
            agent-platform/scripts/trading-research-qc-smoke \
            agent-platform/scripts/trading-research-qc-broker \
            agent-platform/scripts/trading-orchestrator-tick \
            agent-platform/tools/trading_agent_token.py \
            agent-platform/tools/trading_orchestrator.py \
            agent-platform/tools/trading_coding_agent.py \
            agent-platform/tools/trading_review_agent.py \
            agent-platform/tools/trading_coding_agent_stub.py \
            agent-platform/tools/trading_research_agent.py \
            "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/"
          scp -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$tmp_qc_env" "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/quantconnect.env"

      - name: Install tools and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_DIR: /tmp/trader-agent-tools-${{ github.sha }}
          QUANTCONNECT_USER_ID: ${{ secrets.QUANTCONNECT_USER_ID }}
          QUANTCONNECT_API_TOKEN: ${{ secrets.QUANTCONNECT_API_TOKEN }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          configure_shared_collab_dir() {
            local path="$1"
            sudo install -d -o root -g agent-lean -m 2770 "$path"
            sudo chgrp -R agent-lean "$path"
            sudo chmod -R g+rwX "$path"
            sudo find "$path" -type d -exec chmod 2770 {} +
            if command -v setfacl >/dev/null 2>&1; then
              sudo setfacl -m g:agent-lean:rwx,m::rwx "$path"
              sudo find "$path" -type d -exec setfacl -m g:agent-lean:rwx,d:g:agent-lean:rwx,d:m::rwx,m::rwx {} +
            else
              echo "setfacl not found; shared Lean roles must use umask 0002 for collaborative writes" >&2
            fi
          }
          validate_shared_collab_dir() {
            local path="$1"
            local smoke_dir="$path/.deploy-collab-$$"
            sudo rm -rf "$smoke_dir"
            if command -v setfacl >/dev/null 2>&1; then
              sudo -n -u agent-coding bash -lc "set -euo pipefail; umask 022; mkdir '$smoke_dir'; printf coding > '$smoke_dir/from-coding.txt'"
              sudo -n -u agent-review bash -lc "set -euo pipefail; printf review >> '$smoke_dir/from-coding.txt'; umask 022; mkdir '$smoke_dir/review-subdir'; printf review > '$smoke_dir/review-subdir/from-review.txt'"
              sudo -n -u agent-validator bash -lc "set -euo pipefail; printf validator >> '$smoke_dir/review-subdir/from-review.txt'"
            else
              sudo -n -u agent-coding bash -lc "set -euo pipefail; umask 0002; mkdir '$smoke_dir'; printf coding > '$smoke_dir/from-coding.txt'"
              sudo -n -u agent-review bash -lc "set -euo pipefail; printf review >> '$smoke_dir/from-coding.txt'; umask 0002; mkdir '$smoke_dir/review-subdir'; printf review > '$smoke_dir/review-subdir/from-review.txt'"
              sudo -n -u agent-validator bash -lc "set -euo pipefail; printf validator >> '$smoke_dir/review-subdir/from-review.txt'"
            fi
            sudo -n -u agent-research bash -lc "set -euo pipefail; test -w '$smoke_dir/from-coding.txt'; test -w '$smoke_dir/review-subdir/from-review.txt'"
            sudo rm -rf "$smoke_dir"
          }
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_orchestrator.py" /usr/local/lib/trading_orchestrator.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_coding_agent.py" /usr/local/lib/trading_coding_agent.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_review_agent.py" /usr/local/lib/trading_review_agent.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_coding_agent_stub.py" /usr/local/lib/trading_coding_agent_stub.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_research_agent.py" /usr/local/lib/trading_research_agent.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-agent-loop" /usr/local/bin/trading-research-agent-loop
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-qc-smoke" /usr/local/bin/trading-research-qc-smoke
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-qc-broker" /usr/local/bin/trading-research-qc-broker
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-orchestrator-tick" /usr/local/bin/trading-orchestrator-tick
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-dispatch-coding-agent" /usr/local/sbin/trading-dispatch-coding-agent
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-dispatch-review-agent" /usr/local/sbin/trading-dispatch-review-agent
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-dispatch-coding-agent-stub" /usr/local/sbin/trading-dispatch-coding-agent-stub
          for role in coding review validator research research-runner; do
            if ! id "agent-$role" >/dev/null 2>&1; then
              sudo useradd --system --create-home --shell /usr/sbin/nologin "agent-$role"
            fi
          done
          if ! getent group agent-lean >/dev/null 2>&1; then
            sudo groupadd --system agent-lean
          fi
          if ! command -v setfacl >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends acl
          fi
          sudo usermod -aG agent-lean agent-coding
          sudo usermod -aG agent-lean agent-review
          sudo usermod -aG agent-lean agent-validator
          sudo usermod -aG agent-lean agent-research
          sudo usermod -aG agent-lean agent-research-runner
          sudo usermod -aG agent-research-runner agent-research
                              sudo install -d -o agent-coding -g agent-coding -m 750 /agents/coding /agents/coding/lean-workspace
          sudo install -d -o agent-review -g agent-review -m 750 /agents/review /agents/review/lean-workspace
          sudo install -d -o agent-validator -g agent-validator -m 750 /agents/validator /agents/validator/lean-workspace
          sudo install -d -o agent-research -g agent-research -m 750 /agents/research /agents/research/state /agents/research/logs /agents/research/reports /agents/research/lean-workspace
          sudo chown -R agent-research:agent-research /agents/research
          sudo chmod 750 /agents/research /agents/research/state /agents/research/logs /agents/research/reports /agents/research/lean-workspace
          sudo install -d -o agent-research -g agent-research-runner -m 750 /agents/research/handoff
          sudo install -d -o root -g agent-lean -m 750 /agents/shared
          configure_shared_collab_dir /agents/shared/lean-projects
          configure_shared_collab_dir /agents/shared/research-artifacts
          if ! getent group agent-quantconnect >/dev/null 2>&1; then
            sudo groupadd --system agent-quantconnect
          fi
          sudo usermod -aG agent-quantconnect agent-orchestrator
          sudo usermod -aG agent-quantconnect agent-validator
          sudo usermod -aG agent-quantconnect agent-research
                    sudo install -d -o root -g agent-research -m 750 /etc/trading-agents/secrets/research
          if ! sudo test -e /etc/trading-agents/secrets/research/env; then
            sudo install -o root -g agent-research -m 640 /dev/null /etc/trading-agents/secrets/research/env
          fi
          sudo chown root:agent-research /etc/trading-agents/secrets/research/env
          sudo chmod 640 /etc/trading-agents/secrets/research/env
          sudo install -d -o root -g agent-quantconnect -m 750 /etc/trading-agents/secrets/quantconnect
          sudo install -o root -g agent-quantconnect -m 640 "$DEPLOY_DIR/quantconnect.env" /etc/trading-agents/secrets/quantconnect/env
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_agent_token.py" /usr/local/bin/trading-agent-token
          sudo tee /usr/local/bin/trading-orchestrator >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_orchestrator.py "$@"
          EOF_BIN
          sudo tee /usr/local/bin/trading-coding-agent >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_coding_agent.py "$@"
          EOF_BIN
          sudo tee /usr/local/bin/trading-review-agent >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_review_agent.py "$@"
          EOF_BIN
          sudo tee /usr/local/bin/trading-coding-agent-stub >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_coding_agent_stub.py "$@"
          EOF_BIN
          sudo tee /usr/local/bin/trading-research-agent >/dev/null <<'EOF_BIN'
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 /usr/local/lib/trading_research_agent.py "$@"
          EOF_BIN
          sudo chmod 755 /usr/local/bin/trading-orchestrator /usr/local/bin/trading-coding-agent /usr/local/bin/trading-review-agent /usr/local/bin/trading-coding-agent-stub /usr/local/bin/trading-research-agent /usr/local/bin/trading-research-agent-loop /usr/local/bin/trading-research-qc-smoke /usr/local/bin/trading-research-qc-broker /usr/local/bin/trading-orchestrator-tick /usr/local/sbin/trading-dispatch-coding-agent /usr/local/sbin/trading-dispatch-review-agent /usr/local/sbin/trading-dispatch-coding-agent-stub
          python3 - <<'PY'
          from pathlib import Path
          for file in [
              Path('/usr/local/lib/trading_orchestrator.py'),
              Path('/usr/local/lib/trading_coding_agent.py'),
              Path('/usr/local/lib/trading_review_agent.py'),
              Path('/usr/local/lib/trading_coding_agent_stub.py'),
              Path('/usr/local/lib/trading_research_agent.py'),
              Path('/usr/local/bin/trading-agent-token'),
          ]:
              compile(file.read_text(), str(file), 'exec')
          PY
          test -s /etc/trading-agents/github-apps.json
          sudo -n -u agent-orchestrator env PYTHONDONTWRITEBYTECODE=1 trading-agent-token orchestrator | python3 -c 'import sys; token=sys.stdin.read().strip(); assert len(token) > 20'
          sudo -n -u agent-coding env PYTHONDONTWRITEBYTECODE=1 trading-agent-token coding | python3 -c 'import sys; token=sys.stdin.read().strip(); assert len(token) > 20'
          sudo -n -u agent-review env PYTHONDONTWRITEBYTECODE=1 trading-agent-token review | python3 -c 'import sys; token=sys.stdin.read().strip(); assert len(token) > 20'
          sudo -n -u agent-orchestrator bash -lc 'set -a; . /etc/trading-agents/secrets/quantconnect/env; test -n "$QUANTCONNECT_USER_ID"; test -n "$QUANTCONNECT_API_TOKEN"'
          sudo -n -u agent-research bash -lc 'set -a; . /etc/trading-agents/secrets/quantconnect/env; test -n "$QUANTCONNECT_USER_ID"; test -n "$QUANTCONNECT_API_TOKEN"'
          sudo -n -u agent-validator bash -lc 'set -a; . /etc/trading-agents/secrets/quantconnect/env; test -n "$QUANTCONNECT_USER_ID"; test -n "$QUANTCONNECT_API_TOKEN"'
          sudo -n -u agent-coding bash -lc 'test ! -r /etc/trading-agents/secrets/quantconnect/env'
          sudo -n -u agent-review bash -lc 'test ! -r /etc/trading-agents/secrets/quantconnect/env'
          sudo -n -u agent-research-runner bash -lc 'test ! -r /etc/trading-agents/secrets/quantconnect/env'
          sudo -n -u agent-research bash -lc 'test -r /etc/trading-agents/secrets/quantconnect/env'
          sudo -n -u agent-coding bash -lc 'test -d /agents/coding/lean-workspace && test -w /agents/coding/lean-workspace && test -w /agents/shared/lean-projects'
          sudo -n -u agent-review bash -lc 'test -d /agents/review/lean-workspace && test -w /agents/review/lean-workspace && test -w /agents/shared/research-artifacts'
          sudo -n -u agent-validator bash -lc 'test -d /agents/validator/lean-workspace && test -w /agents/validator/lean-workspace && test -w /agents/shared/lean-projects'
          sudo -n -u agent-research bash -lc 'test -d /agents/research/lean-workspace && test -w /agents/research/lean-workspace && test -w /agents/shared/research-artifacts'
          sudo -n -u agent-research bash -lc 'test -d /agents/research/lean-workspace && test -w /agents/research/lean-workspace && test -w /agents/shared/research-artifacts && test -w /agents/research/handoff'
          validate_shared_collab_dir /agents/shared/lean-projects
          validate_shared_collab_dir /agents/shared/research-artifacts
          if ! sudo python3 -c 'import lean' >/dev/null 2>&1 || ! sudo -n -u agent-research bash -lc 'command -v lean >/dev/null 2>&1'; then
            if ! python3 -m pip --version >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-pip python3-venv
            fi
            sudo python3 -m pip install --break-system-packages --upgrade lean
          fi
          sudo python3 - <<'PY_LEAN_MODULES'
          import lean.models
          PY_LEAN_MODULES
          sudo python3 - <<'PY_CHMOD'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.find_spec("lean")
          if spec and spec.submodule_search_locations:
              Path(spec.submodule_search_locations[0]).chmod(0o755)
              for root, dirs, files in os.walk(spec.submodule_search_locations[0]):
                  for d in dirs:
                      Path(root, d).chmod(0o755)
                  for f in files:
                      file = Path(root, f)
                      file.chmod(file.stat().st_mode | 0o444)
          PY_CHMOD
          sudo -n -u agent-research bash -lc 'command -v lean >/dev/null 2>&1'
          sudo -n -u agent-validator bash -lc 'command -v lean >/dev/null 2>&1'
          sudo -n -u agent-research bash -lc 'set -euo pipefail; set -a; . /etc/trading-agents/secrets/quantconnect/env; set +a; export HOME=/home/agent-research; mkdir -p /agents/research/lean-workspace; printf "%s\n" "$QUANTCONNECT_API_TOKEN" | lean login --user-id "$QUANTCONNECT_USER_ID" >/tmp/trader-lean-login.log; lean whoami >/tmp/trader-lean-whoami.log'
          sudo -n -u agent-research bash -lc 'lean whoami >/tmp/trader-lean-research-whoami.log'
          sudo -n -u agent-research trading-research-qc-smoke --json >/tmp/trader-research-qc-smoke.jsonl
          grep -q '"result":"QC_AUTH_OK"' /tmp/trader-research-qc-smoke.jsonl
          sudo install -d -o agent-research-runner -g agent-research-runner -m 700 /home/agent-research-runner/.codex
          if sudo test -s /home/agent-research/.codex/auth.json && ! sudo test -s /home/agent-research-runner/.codex/auth.json; then
            sudo install -o agent-research-runner -g agent-research-runner -m 600 /home/agent-research/.codex/auth.json /home/agent-research-runner/.codex/auth.json
          fi
          sudo test -s /home/agent-research-runner/.codex/auth.json
          sudo -n -u agent-research-runner bash -lc 'test -s /home/agent-research-runner/.codex/auth.json && codex --version >/dev/null'
          sudo tee /usr/local/bin/trading-research-runner-codex >/dev/null <<'RUNNER_CODEX'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$#" -lt 2 || "$#" -gt 3 ]]; then
            echo "usage: trading-research-runner-codex TASK_FILE OUTPUT_DIR [MODEL]" >&2
            exit 64
          fi
          TASK_FILE="$1"
          OUTPUT_DIR="$2"
          MODEL="${3:-gpt-5.4-mini}"
          case "$MODEL" in
            *[!A-Za-z0-9._/-]*|"") echo "ERROR: unsafe model name" >&2; exit 70 ;;
          esac
          case "$TASK_FILE" in
            /agents/research/handoff/research-pass-*-task.txt|/agents/research/handoff/idea-generation-*-task.txt) ;;
            *) echo "ERROR: task file must be an approved research handoff" >&2; exit 65 ;;
          esac
          case "$OUTPUT_DIR" in
            /agents/research/reports/research-pass-*|/agents/research/reports/idea-generation-*) ;;
            *) echo "ERROR: output dir must be an approved research reports directory" >&2; exit 67 ;;
          esac
          if [[ -L "$TASK_FILE" || -L "$OUTPUT_DIR" || ! -r "$TASK_FILE" || ! -d "$OUTPUT_DIR" || ! -w "$OUTPUT_DIR" ]]; then
            echo "ERROR: task/output permissions are not usable" >&2
            exit 66
          fi
          TASK_REAL="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$TASK_FILE")"
          OUT_REAL="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$OUTPUT_DIR")"
          case "$TASK_REAL" in
            /agents/research/handoff/research-pass-*-task.txt|/agents/research/handoff/idea-generation-*-task.txt) ;;
            *) echo "ERROR: resolved task path escaped handoff" >&2; exit 68 ;;
          esac
          case "$OUT_REAL" in
            /agents/research/reports/research-pass-*|/agents/research/reports/idea-generation-*) ;;
            *) echo "ERROR: resolved output path escaped reports" >&2; exit 69 ;;
          esac
          cd "$OUT_REAL"
          export HOME=/home/agent-research-runner
          export PATH=/usr/local/bin:/usr/bin:/bin
          export PYTHONDONTWRITEBYTECODE=1
          umask 0007
          if [[ -r /etc/trading-agents/secrets/quantconnect/env ]]; then
            echo "ERROR: runner user can read QuantConnect secrets" >&2
            exit 71
          fi
          exec /usr/bin/timeout 6h /usr/local/bin/codex exec --skip-git-repo-check --sandbox workspace-write -c approval_policy="never" --model "$MODEL" "$(cat "$TASK_REAL")"
          RUNNER_CODEX
          sudo chown root:root /usr/local/bin/trading-research-runner-codex
          sudo chmod 755 /usr/local/bin/trading-research-runner-codex
          sudo tee /etc/sudoers.d/trading-agent-orchestrator-dispatch >/dev/null <<'EOF_SUDOERS'
          agent-orchestrator ALL=(root) NOPASSWD: /usr/local/sbin/trading-dispatch-coding-agent *
          agent-orchestrator ALL=(root) NOPASSWD: /usr/local/sbin/trading-dispatch-review-agent *
          agent-orchestrator ALL=(root) NOPASSWD: /usr/local/sbin/trading-dispatch-coding-agent-stub *
          EOF_SUDOERS
          sudo chmod 440 /etc/sudoers.d/trading-agent-orchestrator-dispatch
          sudo visudo -cf /etc/sudoers.d/trading-agent-orchestrator-dispatch >/dev/null
          sudo tee /etc/sudoers.d/trading-agent-research-runner >/dev/null <<'EOF_SUDOERS_RUNNER'
          # Allow the research loop to run only the offline Codex wrapper as the isolated runner user.
          agent-research ALL=(agent-research-runner) NOPASSWD: /usr/local/bin/trading-research-runner-codex *
          EOF_SUDOERS_RUNNER
          sudo chmod 440 /etc/sudoers.d/trading-agent-research-runner
          sudo visudo -cf /etc/sudoers.d/trading-agent-research-runner >/dev/null
          sudo -n -u agent-orchestrator env PYTHONDONTWRITEBYTECODE=1 trading-orchestrator status >/tmp/trader-orchestrator-status.json
          sudo -n -u agent-orchestrator env PYTHONDONTWRITEBYTECODE=1 trading-orchestrator cleanup-workspaces --older-than-hours 24 >/tmp/trader-cleanup-dry-run.json
          sudo -n -u agent-research rm -f /agents/research/state/deploy-smoke-queue.json
          sudo -n -u agent-research env PYTHONDONTWRITEBYTECODE=1 trading-research-agent --queue /agents/research/state/deploy-smoke-queue.json seed-cheap-calls >/tmp/trader-research-seed.json
          sudo -n -u agent-research env PYTHONDONTWRITEBYTECODE=1 trading-research-agent --queue /agents/research/state/deploy-smoke-queue.json next >/tmp/trader-research-next.json
          sudo -n -u agent-research env PYTHONDONTWRITEBYTECODE=1 TRADING_RESEARCH_QUEUE=/agents/research/state/deploy-smoke-queue.json TRADING_RESEARCH_LOCK=/agents/research/state/deploy-smoke-loop.lock TRADING_RESEARCH_LOOP_ONCE=1 TRADING_RESEARCH_LOOP_DISABLE_SEED=1 TRADING_RESEARCH_LOOP_DRY_RUN=1 trading-research-agent-loop >/tmp/trader-research-loop-smoke.log
          test -s /tmp/trader-research-loop-smoke.log
          latest_smoke_dir=$(sudo -n -u agent-research bash -lc 'ls -td /agents/research/reports/research-pass-* | head -1')
          sudo -n -u agent-research bash -lc 'test -d /agents/research/handoff && test -w /agents/research/handoff'
          sudo -n -u agent-research-runner bash -lc 'test -x /agents/research/handoff'
          sudo -n -u agent-research bash -lc 'set -euo pipefail; f=/agents/research/handoff/deploy-runner-readable.txt; rm -f "$f"; install -o agent-research -g agent-research-runner -m 640 /dev/null "$f"; printf ok > "$f"'
          sudo -n -u agent-research-runner bash -lc 'test "$(cat /agents/research/handoff/deploy-runner-readable.txt)" = ok'
          sudo -n -u agent-research bash -lc "test -r '$latest_smoke_dir/candidate.json' && test -r '$latest_smoke_dir/mandate.json' && test -r '$latest_smoke_dir/qc_prompt.json' && test -r '$latest_smoke_dir/task.txt'"
          sudo -n -u agent-research trading-research-qc-broker research-artifact "$latest_smoke_dir" "$latest_smoke_dir/candidate.json" --dry-run >/tmp/trader-research-qc-artifact-dry-run.txt
          if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files --type=service | grep -q '^trading-research-agent\.service'; then
            sudo systemctl restart trading-research-agent.service
          fi
          bash -n /usr/local/bin/trading-research-agent-loop
          bash -n /usr/local/bin/trading-research-qc-smoke
          bash -n /usr/local/bin/trading-research-qc-broker
          bash -n /usr/local/bin/trading-orchestrator-tick
          bash -n /usr/local/sbin/trading-dispatch-review-agent
          grep -q "dispatch missing-reviews" /usr/local/bin/trading-orchestrator-tick
          bash -n /usr/local/bin/trading-research-runner-codex
          grep -q "Option Pricing / Volatility Intelligence" /usr/local/bin/trading-research-agent-loop
          grep -q "trading-research-qc-broker preflight" /usr/local/bin/trading-research-agent-loop
          grep -q "trading-research-qc-broker research-artifact" /usr/local/bin/trading-research-agent-loop
          grep -q "QC_BROKER_RESEARCH_ARTIFACT_DRY_RUN" /usr/local/bin/trading-research-qc-broker
          grep -q "qc_research_execution_diagnostic.json" /usr/local/bin/trading-research-agent-loop
          grep -q "qc_research_execution_diagnostic.json" /usr/local/bin/trading-research-qc-broker
          grep -q "mkdir -p /agents/research/tmp" /usr/local/bin/trading-research-agent-loop
          grep -q -- "trading-research-runner-codex" /usr/local/bin/trading-research-agent-loop
          grep -q -- "--sandbox workspace-write" /usr/local/bin/trading-research-runner-codex
          grep -q -- "approval_policy=\"never\"" /usr/local/bin/trading-research-runner-codex
          ! grep -q -- "sandbox_workspace_write.network_access=true" /usr/local/bin/trading-research-runner-codex
          ! grep -q -- "--sandbox danger-full-access" /usr/local/bin/trading-research-agent-loop
          ! grep -q -- "/etc/trading-agents/secrets/quantconnect/env" /usr/local/bin/trading-research-agent-loop
          sudo -n -u agent-research rm -f /agents/research/state/deploy-smoke-queue.json
          rm -rf "$DEPLOY_DIR"
          echo DEPLOY_OK
          REMOTE
