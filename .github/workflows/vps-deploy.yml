name: Deploy agent tools to VPS
# Re-indexed by workflow maintenance.

on:
  push:
    branches: [main]
    paths:
      - "agent-platform/tools/trading-*"
      - "agent-platform/tools/trading_*.py"
      - "agent-platform/scripts/trading-research-agent-loop"
      - "agent-platform/scripts/trading-research-qc-smoke"
      - "agent-platform/scripts/trading-research-qc-broker"
      - "agent-platform/scripts/trading-research-qc-cloud-extract"
      - "agent-platform/scripts/trading-research-qc-cloud-run"
      - "agent-platform/scripts/trading-research-qc-run"
      - "agent-platform/scripts/trading-research-qc-api-extract"
      - "agent-platform/scripts/trading-research-qc-docker-run"
      - "agent-platform/scripts/earnings-qc-options/**"
      - "agent-platform/skills/trader-research-system/**"
      - "agent-platform/scripts/trading-orchestrator-tick"
      - ".github/workflows/vps-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Install orchestrator/coding/review tools on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate required secrets are present
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          QUANTCONNECT_USER_ID: ${{ secrets.QUANTCONNECT_USER_ID }}
          QUANTCONNECT_API_TOKEN: ${{ secrets.QUANTCONNECT_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_HOST_KEY"
          test -n "$QUANTCONNECT_USER_ID"
          test -n "$QUANTCONNECT_API_TOKEN"

      - name: Compile tools before deploy
        run: |
          set -euo pipefail
          python3 -m py_compile \
            agent-platform/tools/trading_orchestrator.py \
            agent-platform/tools/trading_coding_agent.py \
            agent-platform/tools/trading_review_agent.py \
            agent-platform/tools/trading_coding_agent_stub.py \
            agent-platform/tools/trading_research_agent.py \
            agent-platform/tools/trading_agent_token.py

      - name: Install SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Pin VPS host key
        env:
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deploy bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_DIR: /tmp/trader-agent-tools-${{ github.sha }}
          QUANTCONNECT_USER_ID: ${{ secrets.QUANTCONNECT_USER_ID }}
          QUANTCONNECT_API_TOKEN: ${{ secrets.QUANTCONNECT_API_TOKEN }}
        run: |
          set -euo pipefail
          tmp_qc_env="$(mktemp)"
          trap 'rm -f "$tmp_qc_env"' EXIT
          chmod 600 "$tmp_qc_env"
          {
            printf "QUANTCONNECT_USER_ID=%q\n" "$QUANTCONNECT_USER_ID"
            printf "QUANTCONNECT_API_TOKEN=%q\n" "$QUANTCONNECT_API_TOKEN"
          } > "$tmp_qc_env"
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "rm -rf '$DEPLOY_DIR' && mkdir -p '$DEPLOY_DIR'"
          scp -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            agent-platform/tools/trading-orchestrator \
            agent-platform/tools/trading-coding-agent \
            agent-platform/tools/trading-dispatch-coding-agent \
            agent-platform/tools/trading-dispatch-review-agent \
            agent-platform/tools/trading-dispatch-coding-agent-stub \
            agent-platform/tools/trading-review-agent \
            agent-platform/tools/trading-research-agent \
            agent-platform/scripts/trading-research-agent-loop \
            agent-platform/scripts/trading-research-qc-smoke \
            agent-platform/scripts/trading-research-qc-broker \
            agent-platform/scripts/trading-research-qc-cloud-extract \
            agent-platform/scripts/trading-research-qc-cloud-run \
            agent-platform/scripts/trading-research-qc-run \
            agent-platform/scripts/trading-research-qc-api-extract \
            agent-platform/scripts/trading-research-qc-docker-run \
            agent-platform/scripts/earnings-qc-options/earnings-qc-research \
            agent-platform/scripts/earnings-qc-options/earnings-qc-classify-bounded-action \
            agent-platform/scripts/earnings-qc-options/earnings-qc-options-scan \
            agent-platform/scripts/earnings-qc-options/earnings-qc-multiyear-backtest \
            agent-platform/scripts/earnings-qc-options/qc_cloud_capacity.py \
            agent-platform/scripts/earnings-qc-options/trading-research-bounded-earnings-qc \
            agent-platform/scripts/earnings-qc-options/earnings-llm-postrun-review \
            agent-platform/scripts/earnings-qc-options/earnings-llm-research-watchdog \
            agent-platform/skills/trader-research-system/SKILL.md \
            agent-platform/scripts/trading-orchestrator-tick \
            agent-platform/tools/trading_agent_token.py \
            agent-platform/tools/trading_orchestrator.py \
            agent-platform/tools/trading_coding_agent.py \
            agent-platform/tools/trading_review_agent.py \
            agent-platform/tools/trading_coding_agent_stub.py \
            agent-platform/tools/trading_research_agent.py \
            "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/"
          scp -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$tmp_qc_env" "$VPS_USER@$VPS_HOST:$DEPLOY_DIR/quantconnect.env"

      - name: Install tools and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_DIR: /tmp/trader-agent-tools-${{ github.sha }}
          QUANTCONNECT_USER_ID: ${{ secrets.QUANTCONNECT_USER_ID }}
          QUANTCONNECT_API_TOKEN: ${{ secrets.QUANTCONNECT_API_TOKEN }}
        run: |
          set -euo pipefail
          deploy_output="$(mktemp)"
          trap 'rm -f "$deploy_output"' EXIT
          ssh -i ~/.ssh/vps_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "DEPLOY_DIR='$DEPLOY_DIR' DEPLOY_USER='$VPS_USER' bash -s" <<'REMOTE' | tee "$deploy_output"
          set -euo pipefail
          configure_shared_collab_dir() {
            local path="$1"
            sudo install -d -o root -g agent-lean -m 2770 "$path"
            sudo chgrp -R agent-lean "$path"
            sudo chmod -R g+rwX "$path"
            sudo find "$path" -type d -exec chmod 2770 {} +
            if command -v setfacl >/dev/null 2>&1; then
              sudo setfacl -m g:agent-lean:rwx,m::rwx "$path"
              sudo find "$path" -type d -exec setfacl -m g:agent-lean:rwx,d:g:agent-lean:rwx,d:m::rwx,m::rwx {} +
            else
              echo "setfacl not found; shared Lean roles must use umask 0002 for collaborative writes" >&2
            fi
          }
          validate_shared_collab_dir() {
            local path="$1"
            local smoke_dir="$path/.deploy-collab-$$"
            sudo rm -rf "$smoke_dir"
            if command -v setfacl >/dev/null 2>&1; then
              sudo -n -u agent-coding bash -lc "set -euo pipefail; umask 022; mkdir '$smoke_dir'; printf coding > '$smoke_dir/from-coding.txt'"
              sudo -n -u agent-review bash -lc "set -euo pipefail; printf review >> '$smoke_dir/from-coding.txt'; umask 022; mkdir '$smoke_dir/review-subdir'; printf review > '$smoke_dir/review-subdir/from-review.txt'"
              sudo -n -u agent-validator bash -lc "set -euo pipefail; printf validator >> '$smoke_dir/review-subdir/from-review.txt'"
            else
              sudo -n -u agent-coding bash -lc "set -euo pipefail; umask 0002; mkdir '$smoke_dir'; printf coding > '$smoke_dir/from-coding.txt'"
              sudo -n -u agent-review bash -lc "set -euo pipefail; printf review >> '$smoke_dir/from-coding.txt'; umask 0002; mkdir '$smoke_dir/review-subdir'; printf review > '$smoke_dir/review-subdir/from-review.txt'"
              sudo -n -u agent-validator bash -lc "set -euo pipefail; printf validator >> '$smoke_dir/review-subdir/from-review.txt'"
            fi
            sudo -n -u agent-research bash -lc "set -euo pipefail; test -w '$smoke_dir/from-coding.txt'; test -w '$smoke_dir/review-subdir/from-review.txt'"
            sudo rm -rf "$smoke_dir"
          }
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_orchestrator.py" /usr/local/lib/trading_orchestrator.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_coding_agent.py" /usr/local/lib/trading_coding_agent.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_review_agent.py" /usr/local/lib/trading_review_agent.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_coding_agent_stub.py" /usr/local/lib/trading_coding_agent_stub.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading_research_agent.py" /usr/local/lib/trading_research_agent.py
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-agent-loop" /usr/local/bin/trading-research-agent-loop
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-qc-smoke" /usr/local/bin/trading-research-qc-smoke
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-qc-broker" /usr/local/bin/trading-research-qc-broker
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-qc-cloud-extract" /usr/local/bin/trading-research-qc-cloud-extract
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-qc-cloud-run" /usr/local/bin/trading-research-qc-cloud-run
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-qc-run" /usr/local/bin/trading-research-qc-run
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-qc-api-extract" /usr/local/bin/trading-research-qc-api-extract
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-qc-docker-run" /usr/local/sbin/trading-research-qc-docker-run
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-orchestrator-tick" /usr/local/bin/trading-orchestrator-tick
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-dispatch-coding-agent" /usr/local/sbin/trading-dispatch-coding-agent
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-dispatch-review-agent" /usr/local/sbin/trading-dispatch-review-agent
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-dispatch-coding-agent-stub" /usr/local/sbin/trading-dispatch-coding-agent-stub
          for role in coding review validator research research-runner research-watchdog; do
            if ! id "agent-$role" >/dev/null 2>&1; then
              sudo useradd --system --create-home --shell /usr/sbin/nologin "agent-$role"
            fi
          done
          if ! getent group agent-lean >/dev/null 2>&1; then
            sudo groupadd --system agent-lean
          fi
          if command -v apt-get >/dev/null 2>&1; then
            if ! command -v setfacl >/dev/null 2>&1; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends acl
            fi
            if ! command -v docker >/dev/null 2>&1 || ! dpkg-query -W -f='${Status}' docker.io 2>/dev/null | grep -q "install ok installed"; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends docker.io
            fi
            if ! command -v psql >/dev/null 2>&1 || ! dpkg-query -W -f='${Status}' postgresql 2>/dev/null | grep -q "install ok installed"; then
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql postgresql-client
            fi
          fi
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl enable --now docker || true
          elif command -v service >/dev/null 2>&1; then
            sudo service docker start || true
          fi
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl enable --now postgresql
          else
            sudo service postgresql start
          fi
          sudo usermod -aG agent-lean agent-coding
          sudo usermod -aG agent-lean agent-review
          sudo usermod -aG agent-lean agent-validator
          sudo usermod -aG agent-lean agent-research
          sudo usermod -aG agent-lean agent-research-runner
          sudo usermod -aG agent-research-runner agent-research
          sudo usermod -aG agent-research-watchdog agent-research
                              sudo install -d -o agent-coding -g agent-coding -m 750 /agents/coding /agents/coding/lean-workspace
          sudo install -d -o agent-review -g agent-review -m 750 /agents/review /agents/review/lean-workspace
          sudo install -d -o agent-validator -g agent-validator -m 750 /agents/validator /agents/validator/lean-workspace
          sudo install -d -o agent-research -g agent-research -m 750 /agents/research /agents/research/state /agents/research/logs /agents/research/reports /agents/research/lean-workspace
          sudo chown -R agent-research:agent-research /agents/research
          sudo chmod 750 /agents/research /agents/research/state /agents/research/logs /agents/research/reports /agents/research/lean-workspace
          sudo setfacl -m "u:${DEPLOY_USER}:x" /agents/research
          sudo setfacl -Rm "u:${DEPLOY_USER}:rx,d:u:${DEPLOY_USER}:rx" /agents/research/state /agents/research/logs /agents/research/reports
          sudo -n -u "$DEPLOY_USER" bash -lc 'test -x /agents/research && test -r /agents/research/state && test -r /agents/research/logs && test -r /agents/research/reports'
          sudo -n -u postgres psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'agent-research'" | grep -q 1 || sudo -n -u postgres psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE "agent-research" LOGIN'
          sudo -n -u postgres psql -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = 'trader_research'" | grep -q 1 || sudo -n -u postgres createdb -O "agent-research" trader_research
          sudo -n -u postgres psql -v ON_ERROR_STOP=1 -d trader_research -c 'CREATE SCHEMA IF NOT EXISTS earnings_cache AUTHORIZATION "agent-research"'
          sudo -n -u postgres psql -v ON_ERROR_STOP=1 -d trader_research -c 'ALTER DATABASE trader_research SET search_path TO earnings_cache, public'
          sudo -n -u postgres psql -v ON_ERROR_STOP=1 -d trader_research -c 'GRANT CONNECT, TEMPORARY ON DATABASE trader_research TO "agent-research"'
          sudo -n -u postgres psql -v ON_ERROR_STOP=1 -d trader_research -c 'GRANT USAGE, CREATE ON SCHEMA earnings_cache TO "agent-research"'
          sudo -n -u agent-research psql -d trader_research -v ON_ERROR_STOP=1 -c 'SELECT 1 AS research_postgres_ready' >/tmp/trader-research-postgres-smoke.txt
          sudo install -d -o agent-research -g agent-research -m 755 /agents/research/bin
          sudo install -d -o agent-research -g agent-research -m 755 /agents/research/libexec/earnings-qc-options
          sudo install -o agent-research -g agent-research -m 755 "$DEPLOY_DIR/earnings-qc-research" /agents/research/bin/earnings-qc-research
          sudo install -o agent-research -g agent-research -m 644 "$DEPLOY_DIR/qc_cloud_capacity.py" /agents/research/bin/qc_cloud_capacity.py
          sudo install -o agent-research -g agent-research -m 644 "$DEPLOY_DIR/qc_cloud_capacity.py" /agents/research/libexec/earnings-qc-options/qc_cloud_capacity.py
          sudo install -o agent-research -g agent-research -m 755 "$DEPLOY_DIR/earnings-qc-classify-bounded-action" /agents/research/libexec/earnings-qc-options/earnings-qc-classify-bounded-action
          sudo install -o agent-research -g agent-research -m 755 "$DEPLOY_DIR/earnings-qc-options-scan" /agents/research/libexec/earnings-qc-options/earnings-qc-options-scan
          sudo install -o agent-research -g agent-research -m 755 "$DEPLOY_DIR/earnings-qc-multiyear-backtest" /agents/research/libexec/earnings-qc-options/earnings-qc-multiyear-backtest
          sudo install -o root -g root -m 755 "$DEPLOY_DIR/trading-research-bounded-earnings-qc" /usr/local/sbin/trading-research-bounded-earnings-qc
          sudo install -o agent-research -g agent-research -m 755 "$DEPLOY_DIR/earnings-llm-postrun-review" /agents/research/bin/earnings-llm-postrun-review
          sudo install -o agent-research -g agent-research -m 755 "$DEPLOY_DIR/earnings-llm-research-watchdog" /agents/research/bin/earnings-llm-research-watchdog
          sudo install -d -o agent-research -g agent-research -m 755 /agents/research/skills/trader-research-system
          sudo install -o agent-research -g agent-research -m 644 "$DEPLOY_DIR/SKILL.md" /agents/research/skills/trader-research-system/SKILL.md
          tmp_cron="$(mktemp)"
          if sudo crontab -l >"$tmp_cron" 2>/dev/null; then
            grep -v -e '/usr/local/bin/earnings-qc-daily-run\.sh' -e '/usr/local/bin/earnings-otm-daily-root\.sh' "$tmp_cron" >"$tmp_cron.cleaned" || true
            sudo crontab "$tmp_cron.cleaned"
            rm -f "$tmp_cron.cleaned"
          fi
          rm -f "$tmp_cron"
          sudo rm -f /usr/local/bin/earnings-qc-daily-run.sh /usr/local/bin/earnings-otm-daily-root.sh
          sudo rm -f /agents/research/bin/earnings-qc-options-full-scan /agents/research/bin/earnings-qc-options-scan /agents/research/bin/earnings-qc-multiyear-backtest
          sudo install -d -o agent-research -g agent-research -m 750 /agents/research/state/earnings-qc-research /agents/research/logs/earnings-qc-research
          sudo tee /agents/research/bin/earnings-otm-daily.sh >/dev/null <<'EOF_DAILY_EARNINGS'
          #!/usr/bin/env bash
          set -euo pipefail
          export TZ=Asia/Jerusalem
          export HOME=/home/agent-research
          export PATH=/agents/research/bin:/usr/local/bin:/usr/bin:/bin
          LOCK=/agents/research/state/earnings-qc-research/daily.lock
          LOG_DIR=/agents/research/logs/earnings-qc-research
          mkdir -p /agents/research/state/earnings-qc-research "$LOG_DIR"
          (
            if ! flock -n 9; then
              holder="$(fuser "$LOCK" 2>/dev/null | tr -s '[:space:]' ' ' | sed 's/^ *//;s/ *$//' || true)"
              if [ -z "$holder" ]; then
                holder="unknown"
              fi
              echo "$(date -u +%FT%TZ) DAILY_RUN_LOCK_CONTENDED lock=$LOCK holder=$holder"
              exit 0
            fi
            earnings-qc-research run             --campaign daily-earnings-otm             --calendar-from-days 21             --calendar-to-days 28             --calendar-source nasdaq             --qc-resolution hour             --option-right call             --max-premium 0.50             --years 1             --parallel 1             --end-to-end
          ) 9>"$LOCK" >> "$LOG_DIR/daily-$(date +%Y%m%d).log" 2>&1
          EOF_DAILY_EARNINGS
          sudo chown agent-research:agent-research /agents/research/bin/earnings-otm-daily.sh
          sudo chmod 755 /agents/research/bin/earnings-otm-daily.sh
          tmp_research_cron="$(mktemp)"
          tmp_research_cron_new="$(mktemp)"
          sudo -n -u agent-research crontab -l >"$tmp_research_cron" 2>/dev/null || true
          awk '
            /# BEGIN trader managed daily earnings research/ {skip=1; next}
            /# END trader managed daily earnings research/ {skip=0; next}
            /# BEGIN trader managed LLM postrun review/ {skip=1; next}
            /# END trader managed LLM postrun review/ {skip=0; next}
            /# BEGIN trader managed LLM research watchdog/ {skip=1; next}
            /# END trader managed LLM research watchdog/ {skip=0; next}
            /^0 9 \* \* \* \/agents\/research\/bin\/earnings-otm-daily\.sh$/ {next}
            /^0 6 \* \* \* \/agents\/research\/bin\/earnings-otm-daily\.sh$/ {next}
            /^\*\/30 \* \* \* \* \/agents\/research\/bin\/earnings-llm-postrun-review/ {next}
            /^\*\/5 \* \* \* \* \/agents\/research\/bin\/earnings-llm-postrun-review/ {next}
            /^\*\/15 \* \* \* \* \/agents\/research\/bin\/earnings-llm-research-watchdog/ {next}
            !skip {print}
          ' "$tmp_research_cron" >"$tmp_research_cron_new"
          sudo -n -u agent-research crontab - <"$tmp_research_cron_new"
          rm -f "$tmp_research_cron" "$tmp_research_cron_new"
          sudo tee /etc/systemd/system/trader-earnings-otm-daily.service >/dev/null <<'EOF_DAILY_SERVICE'
          [Unit]
          Description=Trader earnings OTM deterministic daily scan

          [Service]
          Type=oneshot
          User=agent-research
          Group=agent-research
          Environment=TZ=Asia/Jerusalem
          Environment=HOME=/home/agent-research
          ExecStart=/agents/research/bin/earnings-otm-daily.sh
          EOF_DAILY_SERVICE
          sudo tee /etc/systemd/system/trader-earnings-otm-daily.timer >/dev/null <<'EOF_DAILY_TIMER'
          [Unit]
          Description=Run trader earnings OTM deterministic daily scan at 06:00 Asia/Jerusalem

          [Timer]
          OnCalendar=*-*-* 06:00:00 Asia/Jerusalem
          Persistent=false

          [Install]
          WantedBy=timers.target
          EOF_DAILY_TIMER
          sudo tee /etc/systemd/system/trader-earnings-llm-postrun.service >/dev/null <<'EOF_POSTRUN_SERVICE'
          [Unit]
          Description=Trader earnings LLM postrun review

          [Service]
          Type=oneshot
          User=agent-research
          Group=agent-research
          Environment=TZ=Asia/Jerusalem
          Environment=HOME=/home/agent-research
          ExecStart=/bin/bash -lc '/agents/research/bin/earnings-llm-postrun-review >> /agents/research/logs/earnings-qc-research/llm-postrun-review.log 2>&1'
          EOF_POSTRUN_SERVICE
          sudo tee /etc/systemd/system/trader-earnings-llm-postrun.timer >/dev/null <<'EOF_POSTRUN_TIMER'
          [Unit]
          Description=Run trader earnings LLM postrun review every five minutes in Asia/Jerusalem time

          [Timer]
          OnCalendar=*-*-* *:0/5:00 Asia/Jerusalem
          Persistent=false

          [Install]
          WantedBy=timers.target
          EOF_POSTRUN_TIMER
          sudo tee /etc/systemd/system/trader-earnings-llm-watchdog.service >/dev/null <<'EOF_WATCHDOG_SERVICE'
          [Unit]
          Description=Trader earnings LLM research watchdog

          [Service]
          Type=oneshot
          User=agent-research
          Group=agent-research
          Environment=TZ=Asia/Jerusalem
          Environment=HOME=/home/agent-research
          Environment=EARNINGS_WATCHDOG_DAILY_SCHEDULE=06:00
          Environment=EARNINGS_WATCHDOG_DAILY_SCHEDULE_ZONE=Asia/Jerusalem
          ExecStart=/bin/bash -lc '/agents/research/bin/earnings-llm-research-watchdog >> /agents/research/logs/earnings-qc-research/llm-research-watchdog.log 2>&1'
          EOF_WATCHDOG_SERVICE
          sudo tee /etc/systemd/system/trader-earnings-llm-watchdog.timer >/dev/null <<'EOF_WATCHDOG_TIMER'
          [Unit]
          Description=Run trader earnings LLM research watchdog every fifteen minutes in Asia/Jerusalem time

          [Timer]
          OnCalendar=*-*-* *:0/15:00 Asia/Jerusalem
          Persistent=false

          [Install]
          WantedBy=timers.target
          EOF_WATCHDOG_TIMER
          command -v systemctl >/dev/null 2>&1
          sudo systemctl daemon-reload
